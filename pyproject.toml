[project]
name = "giecar-seismic-filter"
version = "0.1.0"
description = "Filtro Butterworth passa-baixa para dados sísmicos SEG-Y, com UI PyQt5 e processamento streaming"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
